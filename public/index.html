<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Dashboard - 选择产线</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --bg-card-hover: #334155;
            --text-primary: #F1F5F9;
            --text-muted: #94A3B8;
            --border-color: #334155;
            --primary: #3B82F6;
            --purple: #A855F7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 24px; font-weight: 700; color: white; margin-bottom: 8px; }
        .header p { font-size: 13px; color: var(--text-muted); }
        .cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 40px;
            width: 320px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        .card .icon {
            width: 56px; height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 18px;
        }
        .card.knowledge .icon { background: rgba(59, 130, 246, 0.18); }
        .card.support .icon { background: rgba(168, 85, 247, 0.18); }
        .card .name { font-size: 18px; font-weight: 700; color: white; margin-bottom: 6px; }
        .card .desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
        .footer { margin-top: 40px; font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 PM Dashboard</h1>
        <p>请选择要查看的产线 Issue 统计看板</p>
    </div>
    <div class="cards">
        <a class="card knowledge" href="/knowledge/index.html">
            <div class="icon">📘</div>
            <div class="name">GBase Knowledge</div>
            <div class="desc">GBase Knowledge 应用&功能<br>Issue 统计分析看板</div>
        </a>
        <a class="card support" href="/support/index.html">
            <div class="icon">🛠️</div>
            <div class="name">GBaseSupport</div>
            <div class="desc">GBaseSupport 全线产品<br>Issue 统计分析看板</div>
        </a>
    </div>
    <div class="footer">数据每天自动更新 · 各产线数据独立抓取与展示</div>
</body>
</html>
